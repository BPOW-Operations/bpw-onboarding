<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>OTRG PC & PL Playbook</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=DM+Sans:opsz,wght@9..40,700&display=swap">
<style>
:root{--bg:#F4F6F7;--surface:#fff;--fg:#161C1C;--muted:#4F5A59;--line:#C7D0D4;--green:#13B375;--green-ink:#0A7A4F;--slate:#272B35;--bad:#B42318;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0E1313;--surface:#161C1C;--fg:#E7ECED;--muted:#A6B1B0;--line:#364343;--green-ink:#3DD597;--bad:#FF8E84;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.bar{height:10px;background:var(--slate)}.tabs{position:relative;height:0}.tabs i{position:absolute;top:0;width:11%;min-width:36px;height:9px;background:var(--green)}.tabs i:first-child{left:0;border-bottom-right-radius:9px}.tabs i:last-child{right:0;border-bottom-left-radius:9px}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 16px}
form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
.logo{height:26px;width:auto;align-self:flex-start}.logo.d{display:none}
@media (prefers-color-scheme:dark){.logo.l{display:none}.logo.d{display:block;mix-blend-mode:lighten}}
.logo.l{mix-blend-mode:multiply}
.eb{font:700 12px "DM Sans",Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--green-ink)}
h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.01em}
p{margin:0;color:var(--muted)}
label{font:600 13px "DM Sans",Inter,sans-serif}
input[type=password]{font:inherit;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.rem{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--muted)}
button{font:700 15px "DM Sans",Inter,sans-serif;padding:11px 14px;border-radius:8px;border:0;background:var(--green);color:#08130F;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.err{color:var(--bad);font-size:13.5px;min-height:1.2em}
footer{text-align:right;font-weight:700;font-size:13px;padding:0 16px 8px}
.rule{height:2px;background:linear-gradient(90deg,var(--slate),#5b6470 40%,var(--green))}.base{height:12px;background:var(--slate)}
</style>
</head>

<script>
(function(){
var P=JSON.parse(document.getElementById("payload").textContent),K="otrgpb.key.v1";
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function u2b(u){var s="";for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function derive(pw){return crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]).then(function(base){
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.s),iterations:P.it,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"])})}
function decrypt(key){return crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.i)},key,b64(P.c))}
function render(pt){var html=new TextDecoder().decode(pt);document.open();document.write(html);document.close()}
function remember(key){return crypto.subtle.exportKey("raw",key).then(function(raw){try{localStorage.setItem(K,u2b(new Uint8Array(raw)))}catch(e){}})}
var err=document.getElementById("err"),go=document.getElementById("go"),rem=document.getElementById("rem");
if(!window.crypto||!crypto.subtle){err.textContent="This browser can't unlock the page. Open it in an up-to-date Chrome, Edge, Firefox or Safari.";go.disabled=true;return}
var s=null;try{s=localStorage.getItem(K)}catch(e){}
if(s){crypto.subtle.importKey("raw",b64(s),{name:"AES-GCM"},false,["decrypt"]).then(decrypt).then(render).catch(function(){try{localStorage.removeItem(K)}catch(e){}})}
document.getElementById("f").addEventListener("submit",function(e){e.preventDefault();var pw=document.getElementById("pw").value;if(!pw)return;
  var keep=rem.checked;go.disabled=true;go.textContent="Unlocking…";err.textContent="";
  derive(pw).then(function(key){return decrypt(key).then(function(pt){return (keep?remember(key):Promise.resolve()).then(function(){render(pt)})})})
  .catch(function(){go.disabled=false;go.textContent="Unlock";err.textContent="That password didn't work. Check it with your trainer."})});
})();
